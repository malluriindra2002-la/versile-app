<style>
:root{--plum:#3A1F5D;--pink:#C8326B;--ink:#1E1530;--muted:#6B6478;--bg:#F5F3F8;--card:#FFFFFF;--line:#E7E1EE;--green:#1F7A4D;--greenbg:#E6F6EE;--amber:#8A5300;--amberbg:#FFF1D6;--wine:#9D1B4E;--winebg:#FDE7EF}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans','Noto Sans Kannada','Noto Sans Devanagari',sans-serif}
button,input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink)}
button{cursor:pointer}
button:disabled{opacity:.55}
a{color:var(--plum)}
.app{max-width:520px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:90px}
.h1{font-family:Sora,sans-serif;font-weight:700;font-size:22px;margin:0}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.pad{padding:18px 16px}
.card{background:var(--card);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:10px}
.btn{min-height:60px;border-radius:16px;border:none;font-size:18px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;text-decoration:none;padding:0 12px;text-align:center}
.btn.green{background:var(--green);color:#fff}.btn.soft{background:var(--greenbg);color:var(--green)}
.btn.plum{background:var(--plum);color:#fff}.btn.grey{background:#ECE8F1;color:var(--muted)}
.btn.line{background:#fff;border:2px solid var(--line);color:var(--ink);min-height:50px;font-size:16px;font-weight:700}
.btn.pink{background:var(--pink);color:#fff}
.btn.wa{background:#E7F7EE;color:#14663B;min-height:50px;font-size:16px}
.icon-btn{width:52px;height:52px;border-radius:16px;border:none;background:#fff;color:var(--plum);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.pill{height:38px;padding:0 14px;border-radius:19px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:14px;white-space:nowrap}
.pill.on{background:var(--plum);color:#fff;border-color:var(--plum)}
.avatar{width:52px;height:52px;border-radius:26px;background:var(--plum);color:#fff;font-family:Sora;font-weight:700;font-size:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{height:92px;border-radius:18px;background:#fff;border:2px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:6px;text-align:center}
.tile b{font-family:Sora;font-size:28px;line-height:1}
.tile span{font-size:13px;font-weight:800;line-height:1.2}
.banner{border-radius:16px;padding:12px 14px;font-size:15px;font-weight:600}
.thumbs{width:56px;height:56px;border-radius:14px;background:#EFE8F5;display:grid;grid-template-columns:1fr 1fr;gap:3px;padding:6px;flex-shrink:0}
.thumbs i{border-radius:4px;background:#D8CCE6}.thumbs i:nth-child(2n){background:#E9C9D6}.thumbs i:nth-child(3){background:#CFDDF2}
.oname{font-weight:800;font-size:18px}.osub{font-size:14px;color:var(--muted)}
.tag{font-size:13px;font-weight:800;padding:5px 10px;border-radius:10px;display:inline-block;margin:2px 2px 2px 0}
.step{min-height:54px;border-radius:14px;border:2px solid var(--line);background:#fff;display:flex;align-items:center;gap:12px;padding:0 12px;text-align:left;font-size:16px;font-weight:700;width:100%}
.step.on{border-color:var(--green);background:var(--greenbg)}
.box{width:30px;height:30px;border-radius:9px;border:2px solid #B9AECB;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:#fff}
.step.on .box{background:var(--green);border-color:var(--green)}
.urgent{box-shadow:inset 0 0 0 3px var(--wine)}
.list{display:flex;flex-direction:column;gap:12px;padding:0 16px 16px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:14px;font-weight:700;z-index:50;max-width:92vw;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast button{background:#fff;color:var(--ink);border:none;border-radius:10px;height:40px;padding:0 14px;font-weight:800}
.scanfab{position:fixed;right:14px;bottom:86px;z-index:30;width:60px;height:60px;border-radius:50%;border:none;background:#2b1b3d;color:#fff;font-size:26px;box-shadow:0 6px 18px rgba(0,0,0,.28);display:flex;align-items:center;justify-content:center}
.syncpill{position:fixed;top:calc(env(safe-area-inset-top) + 8px);left:50%;transform:translateX(-50%);z-index:60;background:#3A1F5D;color:#fff;font-size:13px;font-weight:700;padding:6px 14px;border-radius:20px;opacity:.9;display:none}
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);height:72px;z-index:20;max-width:520px;margin:0 auto}
.nav button{border:none;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:700;color:var(--muted)}
.nav button.on{color:var(--pink)}
.fab{position:fixed;right:max(18px,calc(50vw - 242px));bottom:90px;width:62px;height:62px;border-radius:20px;border:none;background:var(--pink);color:#fff;box-shadow:0 10px 24px rgba(200,50,107,.35);display:flex;align-items:center;justify-content:center;z-index:21}
.stat{display:flex;flex-direction:column}.stat small{font-size:12px;color:var(--muted)}.stat b{font-size:16px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px}
.bar{height:10px;border-radius:5px;background:#EFE8F5;overflow:hidden}.bar i{display:block;height:100%;border-radius:5px;background:var(--plum)}
.hero{background:var(--plum);color:#fff;border-radius:0 0 28px 28px;padding:22px 16px 76px}
.lift{margin:-60px 16px 0;box-shadow:0 10px 30px rgba(58,31,93,.14)}
.ring{width:96px;height:96px;border-radius:48px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ring>div{width:76px;height:76px;border-radius:38px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 8px}
.sheet-bg{position:fixed;inset:0;background:rgba(30,21,48,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:92vh;overflow-y:auto;border-radius:24px 24px 0 0;padding:18px 16px 28px;display:flex;flex-direction:column;gap:12px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700}
label.f input,label.f select,label.f textarea{height:50px;border-radius:14px;border:1px solid var(--line);background:#fff;padding:0 14px;font-weight:500}
label.f textarea{height:80px;padding:12px 14px}
.chk{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px}
.chk input{width:24px;height:24px}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;max-width:320px}
.keypad button{height:72px;border-radius:20px;border:none;background:#fff;font-family:Sora;font-size:28px;font-weight:700}
.dots{display:flex;gap:14px;justify-content:center;height:24px}
.dots i{width:18px;height:18px;border-radius:9px;border:2px solid var(--plum)}.dots i.f{background:var(--plum)}
.err{color:var(--wine);font-weight:700;text-align:center;min-height:22px}
.loading{padding:60px 16px;text-align:center;color:var(--muted);font-weight:600}
.dot{width:10px;height:10px;border-radius:5px;flex-shrink:0}
.prow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #F1ECF6}
.badge{border-radius:20px;padding:16px;display:flex;align-items:center;gap:14px}
.badge b{font-family:Sora;font-size:22px;line-height:1.15}
.badge .num{width:52px;height:52px;border-radius:26px;background:rgba(255,255,255,.25);font-family:Sora;font-size:24px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.prog{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}.prog i{height:8px;border-radius:4px;background:#E2DAEC}.prog i.f{background:var(--green)}
.need{display:flex;align-items:center;gap:12px;min-height:56px;border-radius:14px;padding:0 14px;font-size:16px;font-weight:700;border:none;width:100%;text-align:left}
.need.ok{background:var(--greenbg);color:var(--green)}.need.no{background:var(--amberbg);color:var(--amber)}
.need .ic{width:30px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:800}
.need.ok .ic{background:var(--green);color:#fff}.need.no .ic{background:#fff;border:2px solid var(--amber)}
.big-id{font-family:Sora;font-size:40px;font-weight:700;letter-spacing:.5px;line-height:1}
.thumb{width:100%;max-height:260px;object-fit:cover;border-radius:16px;background:#EFE8F5}
.labrow{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid #F1ECF6}
.labrow input{width:24px;height:24px;flex-shrink:0}
#printArea{display:none}
@media print{
  @page{size:A4;margin:0}
  html,body{background:#fff!important;margin:0!important;padding:0!important}
  .app,#overlay,.toast,.nav,.fab,.scan-pill,.demo-bar{display:none!important}
  #printArea{display:block!important}
  .sheetpage{position:relative;width:210mm;height:296mm;overflow:hidden;page-break-after:always;break-after:page}
  .sheetpage:last-child{page-break-after:auto;break-after:auto}
  .lab{position:absolute;box-sizing:border-box;display:flex;align-items:center;overflow:hidden;color:#000;font-family:Arial,sans-serif}
  .lab .qr svg{display:block;width:100%;height:100%}
  .sheetpage.cut .lab{border:0.25mm dashed #8a8a8a}
  .lab .t{display:flex;flex-direction:column;min-width:0;overflow:hidden}
  .lab .id{font-weight:700;line-height:1;white-space:nowrap}
  .lab .n,.lab .d{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lab.s{padding:1.3mm 1.4mm;gap:1.4mm}.lab.s .qr{width:18.5mm;height:18.5mm;flex-shrink:0}
  .lab.s .id{font-size:9.5pt}.lab.s .n{font-size:6.5pt;margin-top:1mm}.lab.s .d{font-size:6pt}
  .lab.m{padding:3mm;gap:3mm}.lab.m .qr{width:26mm;height:26mm;flex-shrink:0}
  .lab.m .id{font-size:15pt}.lab.m .n{font-size:9pt;margin-top:1.5mm;font-weight:700}.lab.m .d{font-size:8pt;margin-top:1mm}
}
</style>

<script>
/* ============================================================ state & server */
var S = { labSize: get('vos_labsize') || 's', token: get('vos_token'), user: (function(){ try { return JSON.parse(get('vos_user')||'null'); } catch(e){ return null; } })(), lang: get('vos_lang') || 'en', tab: null, task: null, data: null,
          ticks: {}, filter: 'All', q: '', busy: false, openId: null, view: null };
function get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function put(k,v){ try { if (v===null) localStorage.removeItem(k); else localStorage.setItem(k,v); } catch(e){} }
function call(action, p){
  if (window.VOS_API) {   /* phone app: talk to the Versile OS server directly (no Google login cookies, so no multi-account errors) */
    return fetch(window.VOS_API, { method:'POST', credentials:'omit', redirect:'follow', headers:{ 'Content-Type':'text/plain;charset=utf-8' },
        body: JSON.stringify({ app:1, token:S.token, action:action, p:p||{} }) })
      .then(function(r){ return r.json(); })
      .then(function(r){ if (r && r.error === 'LOGIN') { logoutLocal(); return new Promise(function(){}); } return r || {}; })
      .catch(function(e){ return { error: 'No internet? ' + (e && e.message || '') }; });
  }
  return new Promise(function(res){
    google.script.run.withSuccessHandler(function(r){
      if (r && r.error === 'LOGIN') { logoutLocal(); return; }
      res(r || {});
    }).withFailureHandler(function(e){ res({ error: 'No internet? ' + (e && e.message || '') }); })
      .api(S.token, action, p || {});
  });
}
function esc(s){ return String(s===undefined||s===null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function inr(v){ return typeof v==='number' ? (v<0?'−':'')+'₹'+Math.abs(Math.round(v)).toLocaleString('en-IN') : esc(v); }
function el(){ return document.getElementById('app'); }
/* Last screen is kept on this phone, so the app opens instantly and refreshes in the background. */
function ckey(k){ return 'vos_c_' + (S.user ? S.user.name : '') + '_' + k; }
function cget(k){ try { return JSON.parse(get(ckey(k)) || 'null'); } catch(e){ return null; } }
function cput(k, v){ try { put(ckey(k), JSON.stringify(v)); } catch(e){} }
function cclear(){ try { Object.keys(localStorage).forEach(function(k){ if (k.indexOf('vos_c_')===0) localStorage.removeItem(k); }); } catch(e){} }
function syncing(on){ var p = document.getElementById('syncpill'); if (!p) { p = document.createElement('div'); p.id = 'syncpill'; p.className = 'syncpill'; p.textContent = 'Updating…'; document.body.appendChild(p); } p.style.display = on ? 'block' : 'none'; }
function isOwner(){ return S.user && S.user.roles.indexOf('owner')>=0; }
function isDesk(){ return S.user && (S.user.roles.indexOf('processor')>=0 || isOwner()); }
function wa(phone, msg){ var p = String(phone||'').replace(/\D/g,''); if (p.length===10) p='91'+p; return p ? 'https://wa.me/'+p+(msg?'?text='+encodeURIComponent(msg):'') : ''; }

/* ============================================================ start */
function start(){
  if (!S.token) return renderLogin();
  if (S.user) {
    if (S.openId) { var oid = S.openId; S.openId = null; return openOrder(oid); }
    return home();
  }
  el().innerHTML = '<div class="loading">Loading…</div>';
  call('me').then(function(r){
    if (!r.user) return renderLogin();
    S.user = r.user; put('vos_user', JSON.stringify(r.user));
    if (S.openId) { var id = S.openId; S.openId = null; return openOrder(id); }
    home();
  });
}
function home(){ S.view = null; if (isOwner()) { S.tab = S.tab || 'home'; ownerLoad(); } else staffLoad(); }
function logoutLocal(){ cclear(); put('vos_token', null); put('vos_user', null); syncing(false); S.token = null; S.user = null; S.data = null; S.od = null; renderLogin(); }

/* ============================================================ login */
var pinBuf = '';
function renderLogin(msg){
  pinBuf = '';
  el().innerHTML = '<div class="pad" style="display:flex;flex-direction:column;align-items:center;gap:22px;padding-top:40px">' +
    '<div class="avatar" style="width:72px;height:72px;border-radius:24px;font-size:28px">V</div>' +
    '<div class="h1">Store Versile</div>' + langPills() +
    '<div style="font-size:18px;font-weight:700">' + esc(w().pin) + '</div>' +
    '<div class="dots" id="dots">' + dots() + '</div><div class="err" id="perr">' + esc(msg||'') + '</div>' +
    '<div class="keypad">' + [1,2,3,4,5,6,7,8,9].map(function(n){return '<button data-act="key" data-k="'+n+'">'+n+'</button>';}).join('') +
    '<button data-act="key" data-k="del" aria-label="Delete">⌫</button><button data-act="key" data-k="0">0</button>' +
    '<button data-act="key" data-k="ok" aria-label="Enter" style="background:var(--green);color:#fff">' + ICON.check + '</button></div></div>';
}
function dots(){ var s=''; for (var i=0;i<Math.max(4,pinBuf.length);i++) s+='<i class="'+(i<pinBuf.length?'f':'')+'"></i>'; return s; }
function key(k){
  if (k==='del') pinBuf = pinBuf.slice(0,-1);
  else if (k==='ok') return tryLogin();
  else if (pinBuf.length<6) pinBuf += k;
  document.getElementById('dots').innerHTML = dots();
  document.getElementById('perr').textContent = '';
}
function tryLogin(){
  if (pinBuf.length<4) return;
  var p = pinBuf; document.getElementById('perr').textContent = '…';
  call('login', { pin: p, home: 1 }).then(function(r){
    if (!r.token) return renderLogin(r.error==='Wrong PIN' ? w().wrong : r.error);
    S.token = r.token; put('vos_token', r.token); S.user = r.user; put('vos_user', JSON.stringify(r.user));
    if (r.home && !r.home.error) { if (r.home.owner) cput('ownerHome', r.home.od); else cput('staffHome', r.home.data); }
    start();
  });
}
function langPills(){
  return '<div class="row" style="gap:6px">' + [['en','English'],['kn','ಕನ್ನಡ'],['hi','हिंदी']].map(function(l){
    return '<button class="pill'+(S.lang===l[0]?' on':'')+'" data-act="lang" data-l="'+l[0]+'">'+l[1]+'</button>'; }).join('') + '</div>';
}

/* ============================================================ staff */
var poll = null;
function staffLoad(quiet){
  S.view = null;
  if (!S.data) { var cached = cget('staffHome'); if (cached) { staffShow(cached); quiet = true; } }
  else if (!quiet) { staffShow(S.data); quiet = true; }   // back from an order: show the list at once, refresh behind
  if (!quiet && !S.data) el().innerHTML = '<div class="loading">Loading…</div>';
  if (S.data) syncing(true);
  call('staffHome').then(function(r){
    syncing(false);
    if (r.error) return toast(r.error);
    cput('staffHome', r);
    if (S.view || document.querySelector('.sheet-bg')) { S.data = r; return; }   // person moved on; keep their screen
    staffShow(r);
  });
  clearInterval(poll); poll = setInterval(function(){ if (!S.view && !document.querySelector('.sheet-bg') && !S.busy) staffLoad(true); }, 60000);
}
function staffShow(r){
    S.data = r;
    var mine = myTasks();
    if (!S.task || mine.indexOf(S.task)<0) S.task = mine.filter(function(t){ return t==='chase' ? r.chaseCount : (r.tasks[t]||[]).length; })[0] || mine[0];
    if (S.task === 'chase') return loadChase();
    renderStaff();
}
function myTasks(){
  var r = S.user.roles, own = r.indexOf('owner')>=0, out = [];
  if (r.indexOf('processor')>=0 || own) out = out.concat(['edit','video','pay','ship','review','chase']);
  if (r.indexOf('maker')>=0 || own) out.push('make');
  if (r.indexOf('packer')>=0 || own) out.push('pack');
  return TASKS.filter(function(t){ return out.indexOf(t)>=0; });
}
function countFor(k){ return k==='chase' ? (S.data.chaseCount||0) : (S.data.tasks[k]||[]).length; }

function payBreakdown(tt, t){

  return line(t.earnedL, tt.earned, '') + (tt.bonus?line(t.bonusL, tt.bonus, '+ '):'') + (tt.advance?line(t.advanceL, tt.advance, '− '):'') +
    (tt.deduction?line(t.deductionL, tt.deduction, '− '):'') + (tt.paid?line(t.paidL, tt.paid, '− '):'') + (tt.due < 0 ? line(t.overL, -tt.due, '', true) : line(t.dueL, tt.due, '', true));

var BK = {};

  var o = BK.o || {}; step = step || 'start';
  if (step === 'start') {
    var it = []; Object.keys(S.data.tasks||{}).forEach(function(k){ (S.data.tasks[k]||[]).forEach(function(x){ if (x.id===id) it.push(x); }); });
    BK = { id: id, o: it[0] || { id: id, name: '' }, mode: (it[0] && it[0].urgent) ? 'E' : 'S', weight: '', addr: null };
    o = BK.o;
  }

    '<div class="osub">'+esc(o.name||'')+(o.shopify?' · Shopify '+esc(o.shopify):'')+'</div>';

    h += '<div class="banner" style="background:var(--amberbg);color:var(--amber)">No address from Shopify yet. Type it from the WhatsApp chat:</div>' +

      '<label class="f">Address<textarea id="ba_addr"></textarea></label><div class="grid2"><label class="f">City<input id="ba_city"></label><label class="f">Pincode<input id="ba_pin" inputmode="numeric" maxlength="6"></label></div>' +

function bookAddr(){
  var v = function(i){ return (document.getElementById(i)||{}).value || ''; };

}
function bookQuote(){
  BK.weight = document.getElementById('bk_w').value; BK.addr = bookAddr();
  var box = document.getElementById('bk_q'); box.innerHTML = '<div class="osub">Getting prices…</div>';
  if (BK.addr) { box.innerHTML = '<button class="btn green" data-act="bkbook" data-c="">Book (iCarry picks the courier)</button>'; return; }
  call('shipQuote', { id: BK.id, mode: BK.mode, weight: BK.weight }).then(function(r){
    if (r.error) { box.innerHTML = '<div class="banner" style="background:var(--winebg);color:var(--wine)">'+esc(r.error)+'</div>'; if (r.needAddr) bookSheet(BK.id, 'addr'); return; }

    box.innerHTML = '<div class="osub" style="font-weight:700">Tap a courier to book (cheapest first)</div>' + r.quotes.slice(0, 6).map(function(q, i){
      return '<button class="btn '+(i===0?'green':'line')+'" data-act="bkbook" data-c="'+esc(q.id)+'" style="justify-content:space-between;padding:0 16px"><span>'+esc(q.name)+(i===0?' · cheapest':'')+'</span><span>'+inr(q.cost)+'</span></button>'; }).join('');

function advance(id, from){
  S.busy = true;
  if (!S.view && S.data && S.data.tasks) {   // instant: take the card off the list now, save in the background
    Object.keys(S.data.tasks).forEach(function(k){ S.data.tasks[k] = (S.data.tasks[k]||[]).filter(function(o){ return o.id !== id; }); });
    try { renderStaff(); } catch(e) {}
  }
  syncing(true);
  call('advance', { id: id, from: from }).then(function(r){
    S.busy = false; syncing(false);
    if (r.error) { toast(r.error); return refresh(); }
    delete S.ticks[id];
    var msg = r.shelfTill ? w().shelfTill+' '+r.shelfTill : w().done;
    toast(msg, function(){ call('undo', { id: id }).then(function(u){ if (u.error) toast(u.error); refresh(); }); });
    refresh();
  });
}

function printLabels(){
  var picks = [].slice.call(document.querySelectorAll('[data-li]')).filter(function(c){ return c.checked; }).map(function(c){ return S.labels[Number(c.getAttribute('data-li'))]; });
  if (!picks.length) return toast('Tick at least one jar');
  if (typeof qrcode === 'undefined') return toast('QR maker did not load — check internet');
  var size = document.getElementById('lab_size').value; S.labSize = size; try { localStorage.setItem('vos_labsize', size); } catch(e) {}
  // exact A4 sticker-sheet layouts (mm): columns, rows, label w/h, left & top margin, horizontal & vertical pitch
  var L = size === 'm' ? { c:3, r:8, w:70, h:37, x:0, y:0.5, px:70, py:37 } : { c:5, r:13, w:38.1, h:21.2, x:4.7, y:10.7, px:40.6, py:21.2 };
  var cut = document.getElementById('lab_cut').checked; S.labCut = cut;
  var per = L.c * L.r, start = Math.min(per, Math.max(1, parseInt(document.getElementById('lab_start').value, 10) || 1)) - 1;
  var slots = [], pages = '';
  picks.forEach(function(l, i){ slots.push({ l: l, pos: start + i }); });
  var nPages = Math.ceil((start + picks.length) / per);
  for (var pg = 0; pg < nPages; pg++) {
    pages += '<div class="sheetpage'+(cut?' cut':'')+'">' + slots.filter(function(sl){ return Math.floor(sl.pos / per) === pg; }).map(function(sl){
      var k = sl.pos % per, col = k % L.c, row = Math.floor(k / L.c), l = sl.l;
      var q = qrcode(0, 'L'); q.addData(l.url); q.make();

      (p.phone?'<a class="osub" href="'+esc(wa(p.phone))+'" target="_blank" rel="noopener">WhatsApp supplier</a>':'') + '</div>';
  });

}
function renderMoney(){
  var m = S.od, pl = m.pl, tg = m.home.target;

  var max = Math.max.apply(null, rows.map(function(r){ return Math.abs(r[1]||0); }).concat([1]));

    '<div class="card" style="background:var(--plum);color:#fff"><div style="font-size:13px;color:#D9CDEA">Net profit · this month so far</div><div style="font-family:Sora;font-size:30px;font-weight:700">'+inr(pl.net)+'</div>' +
    '<div class="grid2"><div class="stat"><small style="color:#D9CDEA">Orders/day for ₹1L</small><b>'+esc(tg.perDayMin)+'</b></div><div class="stat"><small style="color:#D9CDEA">For ₹2L</small><b>'+esc(tg.perDayStretch)+'</b></div></div></div>' +
    '<div class="card"><b>Where the money went</b>' + rows.map(function(r){ return '<div><div class="row between" style="font-size:14px"><span>'+r[0]+'</span><b>'+inr(r[1]||0)+'</b></div><div class="bar" style="height:8px;margin-top:4px"><i style="width:'+Math.round(100*Math.abs(r[1]||0)/max)+'%;background:'+r[2]+'"></i></div></div>'; }).join('') + '</div>' +
    '<div class="card"><div class="row between"><b>Commitments</b><b>'+inr(m.total)+'/mo</b></div>' +
    m.commitments.map(function(c){ return '<div class="prow"><div style="flex:1"><b style="font-size:14px">'+esc(c.name)+'</b><div class="osub">'+(c.left===null?'Ongoing':c.left+' months left')+'</div></div><b style="'+(c.thisMonth?'':'color:var(--muted);text-decoration:line-through')+'">'+inr(c.monthly)+'</b></div>'; }).join('') + '</div></div>';

/* ============================================================ sheet & toast */
function sheet(html){ document.getElementById('overlay').innerHTML = '<div class="sheet-bg" data-act="bgclose"><div class="sheet">'+html+'</div></div>'; }
function closeSheet(){ document.getElementById('overlay').innerHTML = ''; }
var toastT = null;
function toast(msg, undoFn){
  var o = document.getElementById('toastBox'); if (o) o.remove();
  var d = document.createElement('div'); d.className = 'toast'; d.id = 'toastBox';
  d.innerHTML = '<span>'+esc(msg)+'</span>' + (undoFn?'<button>'+esc(w().undo)+'</button>':'');
  if (undoFn) d.querySelector('button').onclick = function(){ d.remove(); undoFn(); };
  document.body.appendChild(d); clearTimeout(toastT); toastT = setTimeout(function(){ d.remove(); }, undoFn?8000:3500);
}
function ask(label, cb){
  sheet('<div class="h1" style="font-size:19px">'+esc(label)+'</div><input id="askv" type="number" min="0" inputmode="numeric" style="height:56px;border-radius:14px;border:1px solid var(--line);padding:0 14px;font-size:22px">' +
        '<button class="btn plum" id="askok">Save</button><button class="btn line" data-act="close">Cancel</button>');
  var i = document.getElementById('askv'); i.focus();
  document.getElementById('askok').onclick = function(){ cb(i.value); };
}
function doTick(id, what, on){
  call('tick', { id:id, what:what, on:on }).then(function(r){ closeSheet(); toast(r.error || (on?'Ticked':'Un-ticked')); refresh(); });
}

/* ============================================================ clicks */
document.addEventListener('click', function(e){
  var b = e.target.closest('[data-act]'); if (!b) return;
  var a = b.getAttribute('data-act'), id = b.getAttribute('data-id');
  if (a==='bgclose') { if (e.target===b) closeSheet(); return; }
  if (b.tagName==='A') return;
  switch(a){
    case 'key': key(b.getAttribute('data-k')); break;
    case 'lang': S.lang = b.getAttribute('data-l'); put('vos_lang', S.lang); if (!S.user) renderLogin(); else if (S.view==='order') openOrder(S.viewId, true); else if (S.view==='chase') loadChase(); else if (isOwner() && S.tab!=='work') ownerLoad(true); else renderStaff(); break;
    case 'task': S.task = b.getAttribute('data-t'); if (S.task==='chase') loadChase(); else { S.view = null; renderStaff(); } window.scrollTo(0,0); break;
    case 'tick': var i = Number(b.getAttribute('data-i')); var tk = S.ticks[id] || [false,false,false,false]; tk[i] = !tk[i]; S.ticks[id] = tk; if (S.view==='order') openOrder(S.viewId, true); else renderStaff(); break;
    case 'adv': b.disabled = true; advance(id, b.getAttribute('data-from')); break;
    case 'claim': case 'release': b.disabled = true; call('claim', { id:id, release: a==='release' }).then(function(r){ if (r.error) toast(r.error); refresh(); }); break;
    case 'tickvoice': b.disabled = true; doTick(id, 'voice', true); break;
    case 'tickdetails': b.disabled = true; doTick(id, 'details', true); break;
    case 'ticktrack': b.disabled = true; doTick(id, 'tracking', true); break;
    case 'book': bookSheet(id); break;
    case 'bkmode': BK.mode = b.getAttribute('data-m'); BK.weight = (document.getElementById('bk_w')||{}).value||''; bookSheet(BK.id, document.getElementById('ba_addr') ? 'addr' : 'mode'); break;
    case 'bkquote': bookQuote(); break;
    case 'bkbook': b.disabled = true; bookNow(b.getAttribute('data-c')); break;
    case 'getlabel': call('shipLabel', { id: id }).then(function(r){ if (r.error || !r.label) return toast(r.error || 'Label not ready yet, try again in a minute'); var a = document.createElement('a'); a.href = r.label; a.target = '_blank'; a.rel = 'noopener'; document.body.appendChild(a); a.click(); a.remove(); }); break;
    case 'cancelship': call('cancelShip', { id: id }).then(function(r){ closeSheet(); toast(r.error || 'Courier booking cancelled'); ownerLoad(true); }); break;
    case 'toggle': doTick(id, b.getAttribute('data-what'), b.getAttribute('data-on')==='1'); break;
    case 'punch': b.disabled = true; call('punch').then(function(r){ if (r.error) toast(r.error); refresh(); }); break;
    case 'logoff': logoffSheet(); break;
    case 'stillworking': S.dismissLong = S.data.openLong; renderStaff(); break;
    case 'forgotend': forgotSheet(); break;
    case 'dologoff': var nt = document.getElementById('lo_note').value; if (nt.trim().length < 3) { toast(w().needNote); break; }
      var lt = b.getAttribute('data-left') ? document.getElementById('lo_time').value : '';
      if (b.getAttribute('data-left') && !lt) { toast(w().leftAtQ); break; }
      b.disabled = true; call('punch', { note: nt, leftAt: lt }).then(function(r){ closeSheet(); toast(r.error ? (r.error==='NOTE'?w().needNote:r.error) : w().done); refresh(); }); break;
    case 'tperiod': S.tperiod = b.getAttribute('data-p'); ownerLoad(true); break;
    case 'mypay': myPaySheet(); break;
    case 'mypaym': myPaySheet(b.getAttribute('data-m')); break;
    case 'payroll': payrollSheet(); break;
    case 'payrollm': payrollSheet(b.getAttribute('data-m')); break;
    case 'payrollback': payrollSheet(S.payroll.month); break;
    case 'payform': payForm(Number(b.getAttribute('data-i'))); break;
    case 'savepay': var pi = S.payroll.rows[Number(b.getAttribute('data-i'))];
      call('addPayment', { name: pi.name, month: S.payroll.month, type: document.getElementById('pf_type').value, amount: document.getElementById('pf_amt').value, note: document.getElementById('pf_note').value })
        .then(function(r){ if (r.error) return toast(r.error); toast('Saved'); payrollSheet(S.payroll.month); }); break;
    case 'paynow': var pn = S.payroll.rows[Number(b.getAttribute('data-i'))]; b.disabled = true;
      call('addPayment', { name: pn.name, month: S.payroll.month, type: 'Salary paid', amount: pn.totals.due, note: 'Settled from app' })
        .then(function(r){ if (r.error) return toast(r.error); toast(pn.name+' marked paid'); payrollSheet(S.payroll.month); }); break;
    case 'person': personSheet(Number(b.getAttribute('data-i'))); break;
    case 'fixshift': var rw = b.getAttribute('data-row'); call('fixShift', { row: rw, out: document.getElementById('fx_'+rw).value }).then(function(r){ closeSheet(); toast(r.error||'Saved'); ownerLoad(true); }); break;
    case 'speak': speak(); break;
    case 'outlist': outList(); break;
    case 'report': call('reportLow', { partId: b.getAttribute('data-p') }).then(function(r){ closeSheet(); toast(r.error || w().told); }); break;
    case 'logout': call('logout'); logoutLocal(); break;
    case 'close': closeSheet(); break;
    case 'home': closeSheet(); home(); window.scrollTo(0,0); break;
    case 'open': closeSheet(); openOrder(id); break;
    case 'ownorder': S.tab = 'orders'; call('orders').then(function(r){ S.od = r; orderSheet(id); }); break;
    case 'chase': loadChase(); window.scrollTo(0,0); break;
    case 'labels': closeSheet(); loadLabels(); window.scrollTo(0,0); break;
    case 'labsel': var m = b.getAttribute('data-m'); [].slice.call(document.querySelectorAll('[data-li]')).forEach(function(c){ var l = S.labels[Number(c.getAttribute('data-li'))]; c.checked = m==='all' || (m==='new' && !l.printed); }); break;
    case 'printlabels': printLabels(); break;
    case 'tab': S.tab = b.getAttribute('data-t'); S.data = null; S.view = null; ownerLoad(); window.scrollTo(0,0); break;
    case 'gostage': S.tab = 'orders'; S.filter = b.getAttribute('data-s'); ownerLoad(); break;
    case 'filter': S.filter = b.getAttribute('data-s'); renderOrders(); break;
    case 'order': orderSheet(id); break;
    case 'add': addSheet(); break;
    case 'frominbox': var f = S.inbox[Number(b.getAttribute('data-i'))]; addSheet(f); break;
    case 'ignoreinbox': var f2 = S.inbox[Number(b.getAttribute('data-i'))]; call('ignoreInbox', { row: f2.row }).then(function(){ loadChase(); }); break;
    case 'saveorder': saveOrder(); break;
    case 'saveedit': call('editOrder', { id:id, expdel: document.getElementById('e_exp').value, photos: document.getElementById('e_photos').value }).then(function(r){ closeSheet(); toast(r.error||'Saved'); ownerLoad(true); }); break;
    case 'setstage': call('setStage', { id:id, stage: document.getElementById('stageSel').value }).then(function(r){ closeSheet(); toast(r.error||'Status saved'); ownerLoad(true); }); break;
    case 'undoorder': call('undo', { id:id }).then(function(r){ closeSheet(); toast(r.error||'Undone'); ownerLoad(true); }); break;
    case 'restock': var pid = b.getAttribute('data-p'); ask('How many arrived?', function(v){ call('restock', { partId:pid, qty:v }).then(function(r){ closeSheet(); toast(r.error||'Stock added'); ownerLoad(true); }); }); break;
    case 'count': var pid2 = b.getAttribute('data-p'); ask('Exact count on the shelf now?', function(v){ call('setStock', { partId:pid2, qty:v }).then(function(r){ closeSheet(); toast(r.error||'Count saved'); ownerLoad(true); }); }); break;
  }
});

/* A QR scan opens  <app link>?o=VJ1001  — remember it, then show that order after login. */
/* Inside the Versile OS phone app (shell): a Scan button uses the app's camera, then the shell sends back the order number. */
function openFromScan(id){
  id = String(id||'').toUpperCase().trim(); if (!/^VJ\d+$/.test(id)) { toast('Not a Versile jar QR'); return; }
  if (S.token && S.user) { closeSheet && closeSheet(); openOrder(id); } else { S.openId = id; toast('Log in to open '+id); }
}
window.addEventListener('message', function(e){
  var d = e.data || {}; if (d.versile === 'open') openFromScan(d.id);
});
function shellMode(){
  S.shell = true;
  var b = document.createElement('button'); b.className = 'scanfab'; b.setAttribute('aria-label','Scan a jar'); b.innerHTML = '&#128247;';
  b.onclick = function(){ if (window.VOS_SCAN) window.VOS_SCAN(openFromScan); else try { window.top.postMessage({ versile:'scan' }, '*'); } catch(e){} };
  document.body.appendChild(b);
  try { window.top.postMessage({ versile:'ready' }, '*'); } catch(e){}
}
if (window.VOS_API) {        /* phone app */
  var qp = new URLSearchParams(location.search);
  if (qp.get('o')) { S.openId = qp.get('o').toUpperCase(); if (history.replaceState) history.replaceState(null, '', location.pathname); }
  shellMode(); start();
} else try {
  google.script.url.getLocation(function(loc){
    var p = (loc && loc.parameter) || {};
    if (p.o) S.openId = String(p.o).toUpperCase();
    if (p.shell) shellMode();
    start();
  });
} catch (e) { start(); }
</script>
<div id="vscan"><video id="vcam" playsinline muted></video><div class="fr"></div><div class="m">Point at the jar's QR</div><button id="vclose">Close</button></div>
<div id="vinst"><b>Install Versile OS on this phone</b><p id="vtext"></p><div class="r"><button class="go" id="vgo">Install</button><button class="no" id="vno">Later</button></div></div>
<script>
/* ---------- Scan a jar QR with the phone camera ---------- */
(function(){
  var stream = null, timer = null, det = null, cb = null, cv = document.createElement('canvas'), cx = cv.getContext('2d', { willReadFrequently: true });
  function jsqr(){ return new Promise(function(res){ if (window.jsQR) return res(); var s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js'; s.onload = res; s.onerror = res; document.head.appendChild(s); }); }
  function idFrom(t){ var m = String(t||'').match(/[?&]o=(VJ\d+)/i) || String(t||'').match(/^(VJ\d+)$/i); return m ? m[1].toUpperCase() : ''; }
  function stop(){ clearTimeout(timer); if (stream) stream.getTracks().forEach(function(t){ t.stop(); }); stream = null; document.getElementById('vscan').style.display = 'none'; }
  function tick(){
    var v = document.getElementById('vcam');
    timer = setTimeout(function(){
      if (!stream) return;
      if (det) det.detect(v).then(function(r){ if (r && r[0]) hit(r[0].rawValue); else tick(); }).catch(tick);
      else if (window.jsQR && v.videoWidth) {
        var w = Math.min(v.videoWidth, 720), h = Math.round(v.videoHeight * w / v.videoWidth);
        cv.width = w; cv.height = h; cx.drawImage(v, 0, 0, w, h);
        var r = jsQR(cx.getImageData(0, 0, w, h).data, w, h, { inversionAttempts: 'dontInvert' });
        if (r) hit(r.data); else tick();
      } else tick();
    }, 180);
  }
  function hit(t){ var id = idFrom(t); if (!id) return tick(); if (navigator.vibrate) navigator.vibrate(80); stop(); if (cb) cb(id); }
  window.VOS_SCAN = function(done){
    cb = done; var v = document.getElementById('vcam'); document.getElementById('vscan').style.display = 'flex';
    if ('BarcodeDetector' in window) { try { det = new BarcodeDetector({ formats: ['qr_code'] }); } catch (e) { det = null; } }
    (det ? Promise.resolve() : jsqr()).then(function(){ return navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false }); })
      .then(function(s){ stream = s; v.srcObject = s; return v.play(); }).then(tick)
      .catch(function(){ stop(); toast('Camera not allowed. Allow camera for Versile OS in phone settings.'); });
  };
  document.getElementById('vclose').onclick = stop;
})();
/* ---------- "Install this app" help (only in the browser, not inside the installed app) ---------- */
(function(){
  var standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  var ios = /iphone|ipad|ipod/i.test(navigator.userAgent), deferred = null;
  function later(){ try { return localStorage.getItem('vos_inst') === 'later'; } catch (e) { return false; } }
  function show(text, btn){ if (standalone || later()) return; document.getElementById('vtext').innerHTML = text; document.getElementById('vgo').style.display = btn ? '' : 'none'; document.getElementById('vinst').style.display = 'flex'; }
  document.getElementById('vno').onclick = function(){ document.getElementById('vinst').style.display = 'none'; try { localStorage.setItem('vos_inst', 'later'); } catch (e) {} };
  window.addEventListener('beforeinstallprompt', function(e){ e.preventDefault(); deferred = e; show('Tap <b>Install</b>. The Versile OS icon will appear on your home screen.', true); });
  document.getElementById('vgo').onclick = function(){ if (deferred) { deferred.prompt(); deferred = null; } document.getElementById('vinst').style.display = 'none'; };
  if (ios) setTimeout(function(){ show('In Safari tap <b>Share</b> &#11014;&#xFE0E; at the bottom, then <b>Add to Home Screen</b>.', false); }, 1500);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
})();
</script>
