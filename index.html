var S = { labSize: get('vos_labsize') || 's', token: get('vos_token'), user: (function(){ try { return JSON.parse(get('vos_user')||'null'); } catch(e){ return null; } })(), lang: get('vos_lang') || 'en', tab: null, task: null, data: null,
          ticks: {}, filter: 'Active', q: '', busy: false, openId: null, view: null };
function get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function put(k,v){ try { if (v===null) localStorage.removeItem(k); else localStorage.setItem(k,v); } catch(e){} }
function call(action, p){
  if (window.VOS_API) {   /* phone app: talk to the Versile OS server directly. Courier booking still runs on Google (VOS_GAS). */
    var GAS_ONLY = { shipQuote: 1, bookShip: 1, shipLabel: 1, cancelShip: 1 };
    return fetch(GAS_ONLY[action] && window.VOS_GAS ? window.VOS_GAS : window.VOS_API, { method:'POST', credentials:'omit', redirect:'follow', headers:{ 'Content-Type':'text/plain;charset=utf-8' },
        body: JSON.stringify({ app:1, token:S.token, action:action, p:p||{} }) })
      .then(function(r){ return r.json(); })
      .then(function(r){ if (r && r.error === 'LOGIN') { logoutLocal(); return new Promise(function(){}); } return r || {}; })
      .catch(function(e){ return { error: 'No internet? ' + (e && e.message || '') }; });
  }
  return new Promise(function(res){
    google.script.run.withSuccessHandler(function(r){
      if (r && r.error === 'LOGIN') { logoutLocal(); return; }
      res(r || {});
    }).withFailureHandler(function(e){ res({ error: 'No internet? ' + (e && e.message || '') }); })
      .api(S.token, action, p || {});
  });
}
function esc(s){ return String(s===undefined||s===null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function inr(v){ return typeof v==='number' ? (v<0?'−':'')+'₹'+Math.abs(Math.round(v)).toLocaleString('en-IN') : esc(v); }
function el(){ return document.getElementById('app'); }
/* Last screen is kept on this phone, so the app opens instantly and refreshes in the background. */
function ckey(k){ return 'vos_c_' + (S.user ? S.user.name : '') + '_' + k; }
function cget(k){ try { return JSON.parse(get(ckey(k)) || 'null'); } catch(e){ return null; } }
function cput(k, v){ try { put(ckey(k), JSON.stringify(v)); } catch(e){} }
function cclear(){ try { Object.keys(localStorage).forEach(function(k){ if (k.indexOf('vos_c_')===0) localStorage.removeItem(k); }); } catch(e){} }
function syncing(on){ var p = document.getElementById('syncpill'); if (!p) { p = document.createElement('div'); p.id = 'syncpill'; p.className = 'syncpill'; p.textContent = 'Updating…'; document.body.appendChild(p); } p.style.display = on ? 'block' : 'none'; }
function isOwner(){ return S.user && S.user.roles.indexOf('owner')>=0; }
/* Live updates: every 12 s (while the app is on screen) ask "has anything changed?" — one tiny call.
   If someone else moved a jar, the list redraws by itself. Opening the app again also refreshes at once. */
var LIVE = { v: null };
function liveTick(force){
  if (!S.token || !S.user || document.visibilityState !== 'visible') return;
  if (S.busy || document.querySelector('.sheet-bg') || S.view === 'order') return;
  call('ver').then(function(r){
    if (!r || !r.v) return;
    if (r.rt) liveConnect(r.rt);
    var changed = LIVE.v !== null && r.v !== LIVE.v;
    LIVE.v = r.v;
    if ((changed || force) && !S.busy && !document.querySelector('.sheet-bg')) refresh();
  });
}
setInterval(function(){ liveTick(false); }, 20000);   // backup check; the live connection below normally updates within a second
/* Instant updates: the database rings a bell (table "live") every time any order/stock/attendance changes.
   Every open phone hears it straight away and redraws. Only the bell is public — no order data. */
var LIVE_PENDING = false;
function liveRing(){
  if (!S.token || !S.user || document.visibilityState !== 'visible') { LIVE_PENDING = true; return; }
  if (S.busy || document.querySelector('.sheet-bg') || S.view === 'order') { LIVE_PENDING = true; return; }
  LIVE_PENDING = false; refresh();
}
setInterval(function(){ if (LIVE_PENDING) liveRing(); }, 2000);
var LIVE_ON = false;
function liveConnect(key){
  key = key || window.VOS_SUPA_KEY || get('vos_rt');
  if (LIVE_ON || !window.VOS_SUPA || !key) return;
  LIVE_ON = true; put('vos_rt', key);
  var s = document.createElement('script');
  s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js';
  s.onload = function(){
    try {
      var sb = window.supabase.createClient(window.VOS_SUPA, key);
      var t = null;
      sb.channel('vos-live').on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'live' }, function(){
        clearTimeout(t); t = setTimeout(liveRing, 250);   // several saves in a row → one redraw
      }).subscribe();
    } catch (e) { LIVE_ON = false; }
  };
  s.onerror = function(){ LIVE_ON = false; };
  document.head.appendChild(s);
}
liveConnect();
setTimeout(function(){ liveTick(false); }, 3000);   // first check soon after opening (also gets the live-update key)
document.addEventListener('visibilitychange', function(){ if (document.visibilityState === 'visible') liveTick(true); });
function isDesk(){ return S.user && (S.user.roles.indexOf('processor')>=0 || isOwner()); }

function bookSheet(id, step){

          '<div class="osub">'+esc(l.what)+(l.due?' · deliver '+esc(l.due):'')+(l.printed?' · <span style="color:var(--green)">printed</span>':'')+'</div></div></label>'; }).join('') : '<div class="muted">No open orders.</div>') + '</div>' +
      '<button class="btn pink" data-act="printlabels">'+ICON.qr+' Print / Save as PDF</button>' +
      '<div class="card" style="gap:6px"><b>In the print window</b><div class="osub">Paper size <b>A4</b> · Margins <b>None</b> · Scale <b>100%</b> (not "fit to page").<br>To keep a file, choose <b>Save as PDF</b> as the printer.<br>First time: print one page on plain paper and hold it behind a sticker sheet against the light to check the labels line up.</div></div></div>';
    el().innerHTML = h + (isOwner() ? ownerNav() : '');
  });
}
function printLabels(){
  var picks = [].slice.call(document.querySelectorAll('[data-li]')).filter(function(c){ return c.checked; }).map(function(c){ return S.labels[Number(c.getAttribute('data-li'))]; });
  if (!picks.length) return toast('Tick at least one jar');
  if (typeof qrcode === 'undefined') return toast('QR maker did not load — check internet');
  var size = document.getElementById('lab_size').value; S.labSize = size; try { localStorage.setItem('vos_labsize', size); } catch(e) {}
  // exact A4 sticker-sheet layouts (mm): columns, rows, label w/h, left & top margin, horizontal & vertical pitch
  var L = size === 'm' ? { c:3, r:8, w:70, h:37, x:0, y:0.5, px:70, py:37 } : { c:5, r:13, w:38.1, h:21.2, x:4.7, y:10.7, px:40.6, py:21.2 };
  var cut = document.getElementById('lab_cut').checked; S.labCut = cut;
  var per = L.c * L.r, start = Math.min(per, Math.max(1, parseInt(document.getElementById('lab_start').value, 10) || 1)) - 1;
  var slots = [], pages = '';
  picks.forEach(function(l, i){ slots.push({ l: l, pos: start + i }); });
  var nPages = Math.ceil((start + picks.length) / per);
  for (var pg = 0; pg < nPages; pg++) {
    pages += '<div class="sheetpage'+(cut?' cut':'')+'">' + slots.filter(function(sl){ return Math.floor(sl.pos / per) === pg; }).map(function(sl){
      var k = sl.pos % per, col = k % L.c, row = Math.floor(k / L.c), l = sl.l;
      var q = qrcode(0, 'L'); q.addData(l.url); q.make();
      return '<div class="lab '+size+'" style="left:'+(L.x + col * L.px)+'mm;top:'+(L.y + row * L.py)+'mm;width:'+L.w+'mm;height:'+L.h+'mm">' +
        '<div class="qr">'+q.createSvgTag({ cellSize: 2, margin: 0, scalable: true })+'</div><div class="t"><div class="id">'+esc(l.id)+'</div><div class="n">'+esc(l.name)+'</div><div class="d">'+(l.last4?'…'+esc(l.last4)+' · ':'')+esc(l.due||'')+'</div></div></div>';
    }).join('') + '</div>';
  }
  var area = document.getElementById('printArea');
  area.innerHTML = pages;
  setTimeout(function(){
    window.print();
    call('markLabels', { ids: picks.map(function(l){ return l.id; }) }).then(function(){ toast(picks.length+' label(s) marked printed'); });
  }, 300);
}

    case 'copy': var cv = b.getAttribute('data-v'); try { navigator.clipboard.writeText(cv).then(function(){ toast('Copied ' + cv); }); } catch (e) { toast(cv); } break;
    case 'icarrylink': call('hookUrl').then(function(r){ if (r.error) return toast(r.error); var u = (window.VOS_API || '') + '?icarry=' + r.key; sheet(shead('iCarry tracking link', 'Paste this in iCarry once') + '<div class="card"><div class="osub">In iCarry: Settings → Webhook / Callback URL. Paste this link and save. Then type the VJ number in iCarry\'s Order ID box when booking.</div><div style="word-break:break-all;font-size:13px;font-weight:700">'+esc(u)+'</div><button class="btn plum sm" data-act="copy" data-v="'+esc(u)+'">Copy link</button></div>'); }); break;
    case 'unmatched': call('unmatched').then(function(r){ sheet(shead('Shipments not matched', 'Type the right VJ number for each') + (r.list||[]).map(function(x, i){ return '<div class="card"><b>'+esc(x.awb)+'</b><div class="osub">'+esc(x.courier||'')+(x.ref?' · typed: '+esc(x.ref):'')+'</div><div class="row" style="gap:8px"><input id="um_'+i+'" placeholder="VJ1012" style="flex:1;height:44px;border-radius:12px;border:1px solid var(--line);padding:0 12px;text-transform:uppercase"><button class="btn plum sm" style="width:auto" data-act="linkum" data-awb="'+esc(x.awb)+'" data-i="'+i+'">Link</button></div></div>'; }).join('')); }); break;
    case 'linkum': call('linkShipment', { awb: b.getAttribute('data-awb'), id: val('um_'+b.getAttribute('data-i')).toUpperCase().trim() }).then(function(r){ if (r.error) return toast(r.error); closeSheet(); toast('Linked'); ownerLoad(true); }); break;
    case 'undobar': b.disabled = true; call('undo', { id: id }).then(function(u){ toast(u.error || w().undo + ' ✓'); refresh(); }); break;
    case 'pushon': b.disabled = true; enablePush(b); break;
    case 'drange': S.drange = b.getAttribute('data-r'); var rg = rangeOf(S.drange); S.dfrom = rg[0]; S.dto = rg[1]; document.getElementById('d_from').value = rg[0]; document.getElementById('d_to').value = rg[1]; [].slice.call(b.parentNode.children).forEach(function(x){ x.classList.toggle('on', x === b); }); loadDays(); break;
    case 'dshow': S.drange = 'custom'; S.dfrom = val('d_from'); S.dto = val('d_to'); [].slice.call(document.querySelectorAll('[data-act=drange]')).forEach(function(x){ x.classList.remove('on'); }); loadDays(); break;
    case 'addshift': var pp = S.od.people[S.person]; b.disabled = true; call('addShift', { name: pp.name, date: val('as_date'), inAt: val('as_in'), outAt: val('as_out'), note: val('as_note') }).then(function(r){ b.disabled = false; if (r.error) return toast(r.error); closeSheet(); toast('Shift added'); ownerLoad(true); }); break;
    case 'editshift': var rw2 = b.getAttribute('data-row'); b.disabled = true; call('editShift', { row: rw2, date: b.getAttribute('data-d'), inAt: val('es_in_'+rw2), outAt: val('es_out_'+rw2) }).then(function(r){ b.disabled = false; if (r.error) return toast(r.error); closeSheet(); toast('Times saved'); ownerLoad(true); }); break;
    case 'delshift': if (b.getAttribute('data-sure') !== '1') { b.setAttribute('data-sure','1'); b.textContent = 'Tap again to delete'; return; } call('editShift', { row: b.getAttribute('data-row'), del: 1 }).then(function(r){ if (r.error) return toast(r.error); closeSheet(); toast('Shift deleted'); ownerLoad(true); }); break;
    case 'tickrepeat': b.disabled = true; call('tick', { id: id, what: 'repeat', on: true }).then(function(){ loadChase(); }); break;
    case 'leaddone': b.disabled = true; call('leadDone', { phone: b.getAttribute('data-p') }).then(function(){ loadChase(); }); break;
    case 'stages': stagesSheet(); break;
    case 'chase': S.chaseKind = ''; closeSheet(); loadChase(); window.scrollTo(0,0); break;
    case 'labels': closeSheet(); loadLabels(); window.scrollTo(0,0); break;
    case 'labsel': var m = b.getAttribute('data-m'); [].slice.call(document.querySelectorAll('[data-li]')).forEach(function(c){ var l = S.labels[Number(c.getAttribute('data-li'))]; c.checked = m==='all' || (m==='new' && !l.printed); }); break;
    case 'printlabels': printLabels(); break;
    case 'tab': closeSheet(); S.tab = b.getAttribute('data-t'); if (S.tab === 'orders') { S.filter = 'Active'; S.q = ''; } S.data = null; S.view = null; ownerLoad(); window.scrollTo(0,0); break;
    case 'gostage': closeSheet(); S.tab = 'orders'; S.filter = b.getAttribute('data-s'); ownerLoad(); break;
    case 'filter': S.filter = b.getAttribute('data-s'); S.ordersShell = null; renderOrders(); break;
    case 'order': openDetail(id); break;
    case 'add': addSheet(); break;
    case 'frominbox': var f = S.inbox[Number(b.getAttribute('data-i'))]; addSheet(f); break;
    case 'ignoreinbox': var f2 = S.inbox[Number(b.getAttribute('data-i'))]; call('ignoreInbox', { row: f2.row }).then(function(){ loadChase(); }); break;
    case 'saveorder': saveOrder(); break;
    case 'setstage': if (b.getAttribute('data-sure') !== '1') { b.setAttribute('data-sure','1'); b.textContent = 'Tap again to move'; return; }
      call('setStage', { id:id, stage: document.getElementById('stageSel').value }).then(function(r){ closeSheet(); toast(r.error||'Moved'); afterChange(); }); break;
    case 'delorder': if (b.getAttribute('data-sure') !== '1') { b.setAttribute('data-sure','1'); b.textContent = 'Tap again to delete '+id+' for ever'; b.style.background = 'var(--wine)'; b.style.color = '#fff'; return; }
      b.disabled = true; b.textContent = 'Deleting…';
      call('deleteOrder', { id:id }).then(function(r){ closeSheet(); toast(r.error || (id+' deleted')); S.view = null; ownerLoad(true); }); break;
    case 'undoorder': call('undo', { id:id }).then(function(r){ closeSheet(); toast(r.error||'Undone'); afterChange(); }); break;
    case 'restock': var pid = b.getAttribute('data-p'); ask('How many arrived?', function(v){ call('restock', { partId:pid, qty:v }).then(function(r){ closeSheet(); toast(r.error||'Stock added'); ownerLoad(true); }); }); break;
    case 'count': var pid2 = b.getAttribute('data-p'); ask('Exact count on the shelf now?', function(v){ call('setStock', { partId:pid2, qty:v }).then(function(r){ closeSheet(); toast(r.error||'Count saved'); ownerLoad(true); }); }); break;
  }
});

/* A QR scan opens  <app link>?o=VJ1001  — remember it, then show that order after login. */
/* Inside the Versile OS phone app (shell): a Scan button uses the app's camera, then the shell sends back the order number. */
function openFromScan(id){
  id = String(id||'').toUpperCase().trim(); if (!/^VJ\d+$/.test(id)) { toast('Not a Versile jar QR'); return; }
  if (S.token && S.user) { closeSheet && closeSheet(); openOrder(id); } else { S.openId = id; toast('Log in to open '+id); }
}
window.addEventListener('message', function(e){
  var d = e.data || {}; if (d.versile === 'open') openFromScan(d.id);
});
function shellMode(){
  S.shell = true;
  var b = document.createElement('button'); b.className = 'scanfab'; b.setAttribute('aria-label','Scan a jar'); b.innerHTML = '&#128247;';
  b.onclick = function(){ if (window.VOS_SCAN) window.VOS_SCAN(openFromScan); else try { window.top.postMessage({ versile:'scan' }, '*'); } catch(e){} };
  document.body.appendChild(b);
  try { window.top.postMessage({ versile:'ready' }, '*'); } catch(e){}
}
if (window.VOS_API) {        /* phone app */
  var qp = new URLSearchParams(location.search);
  if (qp.get('o')) { S.openId = qp.get('o').toUpperCase(); if (history.replaceState) history.replaceState(null, '', location.pathname); }
  shellMode(); start();
} else try {
  google.script.url.getLocation(function(loc){
    var p = (loc && loc.parameter) || {};
    if (p.o) S.openId = String(p.o).toUpperCase();
    if (p.shell) shellMode();
    start();
  });
} catch (e) { start(); }
</script>
<div id="vscan"><video id="vcam" playsinline muted></video><div class="fr"></div><div class="m">Point at the jar's QR</div><button id="vclose">Close</button></div>
<div id="vinst"><b>Install Versile OS on this phone</b><p id="vtext"></p><div class="r"><button class="go" id="vgo">Install</button><button class="no" id="vno">Later</button></div></div>
<script>
/* ---------- Scan a jar QR with the phone camera ---------- */
(function(){
  var stream = null, timer = null, det = null, cb = null, cv = document.createElement('canvas'), cx = cv.getContext('2d', { willReadFrequently: true });
  function jsqr(){ return new Promise(function(res){ if (window.jsQR) return res(); var s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js'; s.onload = res; s.onerror = res; document.head.appendChild(s); }); }
  function idFrom(t){ var m = String(t||'').match(/[?&]o=(VJ\d+)/i) || String(t||'').match(/^(VJ\d+)$/i); return m ? m[1].toUpperCase() : ''; }
  function stop(){ clearTimeout(timer); if (stream) stream.getTracks().forEach(function(t){ t.stop(); }); stream = null; document.getElementById('vscan').style.display = 'none'; }
  function tick(){
    var v = document.getElementById('vcam');
    timer = setTimeout(function(){
      if (!stream) return;
      if (det) det.detect(v).then(function(r){ if (r && r[0]) hit(r[0].rawValue); else tick(); }).catch(tick);
      else if (window.jsQR && v.videoWidth) {
        var w = Math.min(v.videoWidth, 720), h = Math.round(v.videoHeight * w / v.videoWidth);
        cv.width = w; cv.height = h; cx.drawImage(v, 0, 0, w, h);
        var r = jsQR(cx.getImageData(0, 0, w, h).data, w, h, { inversionAttempts: 'dontInvert' });
        if (r) hit(r.data); else tick();
      } else tick();
    }, 180);
  }
  function hit(t){ var id = idFrom(t); if (!id) return tick(); if (navigator.vibrate) navigator.vibrate(80); stop(); if (cb) cb(id); }
  window.VOS_SCAN = function(done){
    cb = done; var v = document.getElementById('vcam'); document.getElementById('vscan').style.display = 'flex';
    if ('BarcodeDetector' in window) { try { det = new BarcodeDetector({ formats: ['qr_code'] }); } catch (e) { det = null; } }
    (det ? Promise.resolve() : jsqr()).then(function(){ return navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false }); })
      .then(function(s){ stream = s; v.srcObject = s; return v.play(); }).then(tick)
      .catch(function(){ stop(); toast('Camera not allowed. Allow camera for Versile OS in phone settings.'); });
  };
  document.getElementById('vclose').onclick = stop;
})();
/* ---------- "Install this app" help (only in the browser, not inside the installed app) ---------- */
(function(){
  var standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  var ios = /iphone|ipad|ipod/i.test(navigator.userAgent), deferred = null;
  function later(){ try { return localStorage.getItem('vos_inst') === 'later'; } catch (e) { return false; } }
  function show(text, btn){ if (standalone || later()) return; document.getElementById('vtext').innerHTML = text; document.getElementById('vgo').style.display = btn ? '' : 'none'; document.getElementById('vinst').style.display = 'flex'; }
  document.getElementById('vno').onclick = function(){ document.getElementById('vinst').style.display = 'none'; try { localStorage.setItem('vos_inst', 'later'); } catch (e) {} };
  window.addEventListener('beforeinstallprompt', function(e){ e.preventDefault(); deferred = e; show('Tap <b>Install</b>. The Versile OS icon will appear on your home screen.', true); });
  document.getElementById('vgo').onclick = function(){ if (deferred) { deferred.prompt(); deferred = null; } document.getElementById('vinst').style.display = 'none'; };
  if (ios) setTimeout(function(){ show('In Safari tap <b>Share</b> &#11014;&#xFE0E; at the bottom, then <b>Add to Home Screen</b>.', false); }, 1500);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
})();
</script>
