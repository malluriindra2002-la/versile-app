<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Versile OS</title>
<meta name="theme-color" content="#2b1b3d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Versile OS">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<style>
  html,body{margin:0;height:100%;background:#2b1b3d;font-family:-apple-system,system-ui,Segoe UI,Roboto,sans-serif;overflow:hidden}
  #app{position:fixed;left:0;right:0;bottom:0;top:env(safe-area-inset-top);width:100%;height:calc(100% - env(safe-area-inset-top));border:0;background:#faf7fb}
  #splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#fff;z-index:5;transition:opacity .3s}
  #splash img{width:96px;height:96px;border-radius:22px}
  #splash b{font-size:22px}
  #scan{position:fixed;inset:0;background:#000;z-index:50;display:none;flex-direction:column}
  #scan video{flex:1;width:100%;object-fit:cover}
  #scan .frame{position:absolute;left:50%;top:45%;width:64vw;height:64vw;max-width:300px;max-height:300px;transform:translate(-50%,-50%);border:4px solid #f06292;border-radius:22px;box-shadow:0 0 0 100vmax rgba(0,0,0,.45)}
  #scan .msg{position:absolute;top:calc(env(safe-area-inset-top) + 24px);left:0;right:0;text-align:center;color:#fff;font-size:20px;font-weight:800}
  #scan button{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 28px);left:50%;transform:translateX(-50%);padding:16px 40px;font-size:19px;font-weight:800;border:none;border-radius:40px;background:#fff;color:#2b1b3d}
  #install{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 12px);z-index:40;background:#fff;border-radius:18px;padding:16px;box-shadow:0 10px 30px rgba(0,0,0,.35);display:none;flex-direction:column;gap:10px;color:#2b1b3d}
  #install b{font-size:18px}
  #install p{margin:0;font-size:16px;line-height:1.45}
  #install .row{display:flex;gap:10px}
  #install button{flex:1;padding:14px;font-size:17px;font-weight:800;border-radius:12px;border:none}
  .go{background:#f06292;color:#fff}.no{background:#eee;color:#2b1b3d}
</style>
</head>
<body>
<div id="splash"><img src="icon-192.png" alt=""><b>Versile OS</b><span>Loading…</span></div>
<iframe id="app" title="Versile OS" allow="clipboard-write"></iframe>

<div id="scan"><video id="cam" playsinline muted></video><div class="frame"></div><div class="msg">Point at the jar's QR</div><button id="scanClose">Close</button></div>

<div id="install">
  <b>Install Versile OS on this phone</b>
  <p id="instText"></p>
  <div class="row"><button class="go" id="instGo">Install</button><button class="no" id="instNo">Later</button></div>
</div>

<script>
/* The Versile OS app (Google Apps Script). Everything else lives there; this page only makes it a phone app. */
var APP = 'https://script.google.com/macros/s/AKfycbzSbgwrfqHnrHizQl3Ng3BcmHB-44yM-MWj9uHjlTViWkU7HS_0f8nOLyPEN--NjQsS/exec';

var q = new URLSearchParams(location.search), o = (q.get('o') || '').toUpperCase();
var frame = document.getElementById('app');
frame.src = APP + '?shell=1' + (o ? '&o=' + encodeURIComponent(o) : '');
frame.onload = function(){ var s = document.getElementById('splash'); s.style.opacity = 0; setTimeout(function(){ s.style.display = 'none'; }, 300); };
if (o && history.replaceState) history.replaceState(null, '', location.pathname);

/* ---------- Scan a jar QR with the phone camera ---------- */
var appWin = null, stream = null, timer = null, detector = null, canvas = document.createElement('canvas'), ctx = canvas.getContext('2d', { willReadFrequently: true });
window.addEventListener('message', function(e){
  var d = e.data || {};
  if (d.versile === 'ready') appWin = e.source;
  if (d.versile === 'scan') { appWin = e.source; openScanner(); }
});
function idFrom(text){
  var m = String(text || '').match(/[?&]o=(VJ\d+)/i) || String(text || '').match(/^(VJ\d+)$/i);
  return m ? m[1].toUpperCase() : '';
}
function loadJsQR(){
  return new Promise(function(res){
    if (window.jsQR) return res();
    var s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js'; s.onload = res; s.onerror = res; document.head.appendChild(s);
  });
}
function openScanner(){
  var box = document.getElementById('scan'), v = document.getElementById('cam');
  box.style.display = 'flex';
  if ('BarcodeDetector' in window) { try { detector = new BarcodeDetector({ formats: ['qr_code'] }); } catch (e) { detector = null; } }
  (detector ? Promise.resolve() : loadJsQR()).then(function(){
    return navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
  }).then(function(s){
    stream = s; v.srcObject = s; return v.play();
  }).then(function(){ tick(); }).catch(function(){
    closeScanner(); alert('Camera not allowed. Please allow camera for Versile OS in phone settings.');
  });
}
function tick(){
  var v = document.getElementById('cam');
  timer = setTimeout(function(){
    if (!stream) return;
    if (detector) {
      detector.detect(v).then(function(r){ if (r && r[0]) found(r[0].rawValue); else tick(); }).catch(tick);
    } else if (window.jsQR && v.videoWidth) {
      var w = Math.min(v.videoWidth, 720), h = Math.round(v.videoHeight * w / v.videoWidth);
      canvas.width = w; canvas.height = h; ctx.drawImage(v, 0, 0, w, h);
      var r = jsQR(ctx.getImageData(0, 0, w, h).data, w, h, { inversionAttempts: 'dontInvert' });
      if (r) found(r.data); else tick();
    } else tick();
  }, 180);
}
function found(text){
  var id = idFrom(text);
  if (!id) { tick(); return; }
  if (navigator.vibrate) navigator.vibrate(80);
  closeScanner();
  if (appWin) appWin.postMessage({ versile: 'open', id: id }, '*');
  else frame.src = APP + '?shell=1&o=' + encodeURIComponent(id);
}
function closeScanner(){
  clearTimeout(timer);
  if (stream) stream.getTracks().forEach(function(t){ t.stop(); });
  stream = null; document.getElementById('scan').style.display = 'none';
}
document.getElementById('scanClose').onclick = closeScanner;

/* ---------- "Install this app" help (shown only in the browser, not inside the installed app) ---------- */
var standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
var ios = /iphone|ipad|ipod/i.test(navigator.userAgent), deferred = null;
function seen(){ try { return localStorage.getItem('vos_inst') === 'later'; } catch (e) { return false; } }
function showInstall(text, canClick){
  if (standalone || seen()) return;
  document.getElementById('instText').innerHTML = text;
  document.getElementById('instGo').style.display = canClick ? '' : 'none';
  document.getElementById('install').style.display = 'flex';
}
document.getElementById('instNo').onclick = function(){ document.getElementById('install').style.display = 'none'; try { localStorage.setItem('vos_inst', 'later'); } catch (e) {} };
window.addEventListener('beforeinstallprompt', function(e){ e.preventDefault(); deferred = e; showInstall('Tap <b>Install</b>. The Versile OS icon will appear on your home screen.', true); });
document.getElementById('instGo').onclick = function(){ if (deferred) { deferred.prompt(); deferred = null; } document.getElementById('install').style.display = 'none'; };
if (ios) setTimeout(function(){ showInstall('In Safari tap the <b>Share</b> button <span style="font-size:20px">&#11014;&#xFE0E;</span> at the bottom, then <b>Add to Home Screen</b>.', false); }, 1500);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
</script>
</body>
</html>
